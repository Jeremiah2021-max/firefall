<!DOCTYPE html>
<html>
<head>
  <title>Fire Fall</title>
</head>
<body>
  <div id="start-screen">
    <h1>Fire Fall</h1>
    <button id="start-button">START GAME</button>
  </div>
  <div id="crosshair">+</div>
  <div id="hitmarker"></div>
  <div id="enemy-arrow">▲</div>
  <div id="killfeed"></div>
  <div id="hud">
    <div id="health">
      Health: 100
    </div>
    <div id="ammo">
      Ammo: 30 / 120
    </div>
    <div id="kills">
      Kills: 0
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
