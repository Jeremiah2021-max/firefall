<!DOCTYPE html>
<html>
<head>
  <title>Fire Fall</title>
  <style>
    #health-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 0 0 rgba(0, 255, 0, 0);
      transition: box-shadow 0.3s ease-out;
      z-index: 9999;
    }

    #health-glow.active {
      box-shadow: inset 0 0 100px 50px rgba(0, 255, 0, 0.8);
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>Fire Fall</h1>
    <button id="start-button">START GAME</button>
  </div>
  <div id="crosshair">+</div>
  <div id="hitmarker"></div>
  <div id="enemy-arrow">▲</div>
  <div id="killfeed"></div>
  <div id="hud">
    <div id="health">
      Health: 100
    </div>
    <div id="ammo">
      Ammo: 30 / 120
    </div>
    <div id="kills">
      Kills: 0
    </div>
  </div>
  <div id="health-glow"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
